<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de la Compra</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --primary: #2e7d32; }
        .light { --bg: #f4f6f5; --card: #ffffff; --text: #333333; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .input-row { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #444; border-radius: 6px; background: var(--bg); color: var(--text); }
        button { padding: 10px 15px; border: none; border-radius: 6px; background: var(--primary); color: white; cursor: pointer; }
        canvas { background: white; width: 100%; height: 100px; touch-action: none; cursor: crosshair; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #444; }
        .item-text { display: flex; align-items: center; gap: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body class="dark">
<div class="container">
    <h1>🛒 Lista <button id="theme-btn" style="background:none; font-size: 1.5rem;">🌙</button></h1>
    
    <div class="card">
        <div class="input-row">
            <input type="text" id="item-input" placeholder="Añadir producto...">
            <button id="add-btn">Añadir</button>
        </div>
    </div>

    <div class="card">
        <button id="toggle-canvas" style="width:100%;">✏️ Dibujar nota</button>
        <div id="canvas-area" class="hidden">
            <canvas id="canvas"></canvas>
            <button id="clear-canvas" style="background:#777;">Borrar</button>
            <button id="save-canvas">Guardar</button>
        </div>
    </div>

    <div class="card">
        <h2>Pendientes <button id="clear-pendings" class="hidden btn-danger" style="background:#d32f2f;">Vaciar</button></h2>
        <ul id="list-pendings"></ul>
    </div>

    <div class="card">
        <h2>Comprados <button id="clear-bought" class="hidden btn-danger" style="background:#d32f2f;">Vaciar</button></h2>
        <ul id="list-bought"></ul>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    let drawing = false;

    // --- Lógica de persistencia ---
    function save() {
        const items = [];
        document.querySelectorAll('#list-pendings li').forEach(li => items.push({content: li.dataset.content, isImg: li.dataset.isImg === 'true', completed: false}));
        document.querySelectorAll('#list-bought li').forEach(li => items.push({content: li.dataset.content, isImg: li.dataset.isImg === 'true', completed: true}));
        localStorage.setItem('data', JSON.stringify(items));
        updateUI();
    }

    function render() {
        const items = JSON.parse(localStorage.getItem('data') || '[]');
        document.getElementById('list-pendings').innerHTML = '';
        document.getElementById('list-bought').innerHTML = '';
        items.forEach(item => addItemToDOM(item.content, item.isImg, item.completed));
        updateUI();
    }

    // --- Lógica de UI ---
    function addItemToDOM(content, isImg, completed) {
        const li = document.createElement('li');
        li.dataset.content = content;
        li.dataset.isImg = isImg;
        li.innerHTML = `
            <div class="item-text">
                <input type="checkbox" ${completed ? 'checked' : ''}>
                ${isImg ? `<img src="${content}" style="height:30px;">` : `<span>${content}</span>`}
            </div>
            <button class="del-btn" style="color:red; background:none; border:none; cursor:pointer;">✕</button>
        `;
        li.querySelector('input').onclick = () => { save(); render(); };
        li.querySelector('.del-btn').onclick = () => { li.remove(); save(); render(); };
        (completed ? document.getElementById('list-bought') : document.getElementById('list-pendings')).appendChild(li);
    }

    function updateUI() {
        document.getElementById('clear-pendings').classList.toggle('hidden', document.getElementById('list-pendings').children.length === 0);
        document.getElementById('clear-bought').classList.toggle('hidden', document.getElementById('list-bought').children.length === 0);
    }

    // --- Eventos ---
    document.getElementById('add-btn').onclick = () => {
        const val = document.getElementById('item-input').value;
        if(val) { addItemToDOM(val, false, false); document.getElementById('item-input').value = ''; save(); }
    };

    document.getElementById('toggle-canvas').onclick = () => document.getElementById('canvas-area').classList.toggle('hidden');
    
    canvas.onmousedown = (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
    canvas.onmousemove = (e) => { if(drawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } };
    canvas.onmouseup = () => drawing = false;

    document.getElementById('save-canvas').onclick = () => {
        addItemToDOM(canvas.toDataURL(), true, false);
        ctx.clearRect(0,0,canvas.width,canvas.height);
        document.getElementById('canvas-area').classList.add('hidden');
        save();
    };

    document.getElementById('theme-btn').onclick = () => {
        document.body.classList.toggle('light');
        document.getElementById('theme-btn').textContent = document.body.classList.contains('light') ? '☀️' : '🌙';
    };

    document.getElementById('clear-pendings').onclick = () => { document.getElementById('list-pendings').innerHTML = ''; save(); };
    document.getElementById('clear-bought').onclick = () => { document.getElementById('list-bought').innerHTML = ''; save(); };

    render();
</script>
</body>
</html>
