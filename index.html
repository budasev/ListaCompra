<!DOCTYPE html>
<html lang="es" class="dark-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Mi Lista de la Compra</title>
    <style>
        :root {
            color-scheme: light dark;
            --primary-color: #2e7d32;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --danger-color: #d32f2f;
        }

        html.dark-theme {
            --bg-color: #121212 !important;
            --card-bg: #1e1e1e !important;
            --text-color: #e0e0e0 !important;
            --border-color: #333333 !important;
        }

        html.light-theme {
            --bg-color: #f4f6f5 !important;
            --card-bg: #ffffff !important;
            --text-color: #333333 !important;
            --border-color: #dddddd !important;
        }

        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); margin-bottom: 15px; }
        h2 { font-size: 1rem; color: var(--primary-color); display: flex; justify-content: space-between; align-items: center; margin: 0 0 10px 0; }
        
        .badge { background-color: var(--primary-color); color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; display: none; margin-left: 5px; }
        
        .input-group { display: flex; gap: 5px; flex-wrap: wrap; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); border-radius: 6px; }
        button { background-color: var(--primary-color); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; }
        
        .btn-danger { background-color: var(--danger-color); padding: 6px 10px; font-size: 0.8rem; }
        .canvas-container { border: 2px dashed var(--border-color); background: #fff; width: 100%; margin-bottom: 10px; }
        canvas { display: block; width: 100%; height: 100px; }
        
        ul { list-style: none; padding: 0; margin: 0; }
        li { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-color); }
        .item-left { display: flex; align-items: center; gap: 8px; overflow: hidden; }
        
        /* Ajuste para que el trazo a mano no tenga fondo negro */
        .item-img { height: 30px; background: transparent !important; }
        
        .btn-action { background: none; border: 1px solid var(--border-color); color: var(--text-color); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-delete { color: #d32f2f; border: none; background: none; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

    <button id="theme-toggle" style="position:fixed; top:10px; right:10px; z-index:999;">🌙</button>

    <div class="container">
        <h1>🛒 Mi Lista</h1>

        <div class="card">
            <h2>Añadir</h2>
            <form id="item-form" class="input-group">
                <input type="text" id="item-input" placeholder="Nombre..." autocomplete="off">
                <button type="submit">Añadir</button>
            </form>
        </div>

        <div class="card">
            <button type="button" id="toggle-canvas-btn" style="width:100%; padding:10px; background:#555; color:white; border:none; border-radius:6px;">✏️ Notas a mano</button>
            <div id="canvas-wrapper" style="display:none; margin-top:10px;">
                <div class="canvas-container"><canvas id="draw-canvas"></canvas></div>
                <button type="button" id="clear-canvas" style="background:#757575;">Borrar</button>
                <button type="button" id="save-drawing">Guardar nota</button>
            </div>
        </div>

        <div class="card">
            <h2><span>Pendientes <span id="pending-badge" class="badge">0</span></span> <button id="clear-all-btn" class="btn-danger">Vaciar</button></h2>
            <ul id="shopping-list"></ul>
        </div>

        <div class="card" id="bought-card" style="display:none;">
            <h2><span>Comprados</span> <button id="clear-bought-btn" class="btn-danger">Vaciar</button></h2>
            <ul id="bought-list"></ul>
        </div>
    </div>

    <script>
        const html = document.documentElement;
        const list = document.getElementById('shopping-list'), boughtList = document.getElementById('bought-list');
        const canvas = document.getElementById('draw-canvas'), ctx = canvas.getContext('2d');
        
        document.getElementById('theme-toggle').onclick = () => {
            html.classList.toggle('dark-theme');
            html.classList.toggle('light-theme');
            localStorage.setItem('theme', html.classList.contains('dark-theme') ? 'dark-theme' : 'light-theme');
        };

        function addItem(content, isImage, completed = false) {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="item-left">
                    <input type="checkbox" ${completed ? 'checked' : ''}>
                    ${isImage ? `<img src="${content}" class="item-img">` : `<span>${content}</span>`}
                </div>
                <div>
                    <button class="btn-action btn-up">▲</button>
                    <button class="btn-action btn-down">▼</button>
                    <button class="btn-delete">×</button>
                </div>
            `;
            li.querySelector('input').onchange = (e) => { (e.target.checked ? boughtList : list).appendChild(li); updateUI(); };
            li.querySelector('.btn-up').onclick = () => li.parentNode.insertBefore(li, li.previousElementSibling);
            li.querySelector('.btn-down').onclick = () => li.parentNode.insertBefore(li.nextElementSibling, li);
            li.querySelector('.btn-delete').onclick = () => { li.remove(); updateUI(); };
            (completed ? boughtList : list).appendChild(li);
            updateUI();
        }

        function updateUI() {
            const count = list.children.length;
            document.getElementById('pending-badge').textContent = count;
            document.getElementById('pending-badge').style.display = count > 0 ? 'inline' : 'none';
            document.getElementById('bought-card').style.display = boughtList.children.length > 0 ? 'block' : 'none';
        }

        // Canvas setup
        document.getElementById('toggle-canvas-btn').onclick = () => document.getElementById('canvas-wrapper').style.display = 'block';
        document.getElementById('clear-canvas').onclick = () => ctx.clearRect(0,0,canvas.width,canvas.height);
        document.getElementById('save-drawing').onclick = () => {
            addItem(canvas.toDataURL(), true);
            ctx.clearRect(0,0,canvas.width,canvas.height);
            document.getElementById('canvas-wrapper').style.display = 'none';
        };

        document.getElementById('item-form').onsubmit = (e) => {
            e.preventDefault();
            const input = document.getElementById('item-input');
            if(input.value) { addItem(input.value, false); input.value = ''; }
        };

        document.getElementById('clear-all-btn').onclick = () => { list.innerHTML = ''; updateUI(); };
        document.getElementById('clear-bought-btn').onclick = () => { boughtList.innerHTML = ''; updateUI(); };
    </script>
</body>
</html>
